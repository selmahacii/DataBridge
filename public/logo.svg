  <path d="M24 68 Q60 28 96 68" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Vertical pillars -->
  <line x1="36" y1="56" x2="36" y2="80" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="60" y1="42" x2="60" y2="80" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="84" y1="56" x2="84" y2="80" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="24" y1="80" x2="96" y2="80" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Data dots -->
  <circle cx="36" cy="52" r="4" fill="#F59E0B"/>
  <circle cx="60" cy="36" r="4" fill="#F59E0B"/>
  <circle cx="84" cy="52" r="4" fill="#F59E0B"/>
  <!-- Connecting lines (data flow) -->
  <line x1="40" y1="52" x2="56" y2="38" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="64" y1="38" x2="80" y2="52" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
